plugins {
    id 'com.android.application'
}

android {
    namespace 'app.kegel.watch'
    compileSdk 34

    defaultConfig {
        applicationId "app.kegel.watch"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Firma fija para que cada APK nueva se pueda instalar encima de la anterior.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
