<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Kegel Reloj</title>
<style>
/* Layout: pantalla redonda 1:1 (Galaxy Watch 7, 216 y 240 px CSS). Todo se mide en cqmin, así escala igual en 40 y 44 mm.
   Naranja = contraer, azul = soltar. Inicio con lista de programas que arranca al tocar; sesión con anillo exterior de progreso total. */
:root{
  --page:#0B0F16; --bg:#000000; --surface:#151B26; --surface2:#222B3B; --fg:#F3F6FB; --muted:#93A0B6; --line:#2C3649;
  --heat:#FF8A4C; --heat-ink:#FFB68A; --heat-soft:#3A2418; --cool:#6FB3FF; --cool-soft:#15304D;
  --display:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display)}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:.8cqmin solid var(--cool);outline-offset:.6cqmin}
h2,p{margin:0}

#watch{
  position:fixed;inset:0;container-type:size;overflow:hidden;border-radius:50%;
  background:var(--bg);font:500 6.2cqmin/1.25 var(--display);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.pv{display:none}
@media (min-width:300px){
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;background:var(--page);padding:4vmin}
  #watch{position:relative;inset:auto;flex:none;width:min(80vmin,440px);height:min(80vmin,440px);
    box-shadow:0 0 0 clamp(6px,2vmin,12px) var(--surface2),0 0 0 clamp(8px,2.6vmin,16px) var(--line)}
  .pv{display:block;font:500 13px/1.4 var(--mono);color:var(--muted);text-align:center;max-width:44ch}
}
.view{position:absolute;inset:0}

/* Inicio */
#home{overflow-y:auto;overflow-x:hidden;padding:12cqmin 13cqmin 24cqmin;scrollbar-width:none;overscroll-behavior:contain}
#home::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:2.6cqmin}
.cap{font:500 4.6cqmin/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.today{display:flex;flex-direction:column;align-items:center;gap:1.8cqmin;padding-bottom:1.6cqmin}
.tr{position:relative;width:22cqmin;height:22cqmin}
.tr svg{width:100%;height:100%;display:block}
.tr-track{fill:none;stroke:var(--surface2);stroke-width:9}
.tr-arc{fill:none;stroke:var(--heat);stroke-width:9;stroke-linecap:round;stroke-dasharray:226.19;stroke-dashoffset:226.19;transition:stroke-dashoffset .6s ease}
.tr-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 6.2cqmin/1 var(--mono);font-variant-numeric:tabular-nums}
.streak{font:500 4.8cqmin/1 var(--mono);color:var(--heat-ink)}
.btn{display:flex;align-items:center;justify-content:space-between;gap:2cqmin;width:100%;min-height:15cqmin;padding:2cqmin 5.5cqmin;border-radius:8cqmin;background:var(--surface);text-align:left}
.btn:active{background:var(--surface2)}
.lvl{flex-direction:column;justify-content:center;gap:1.2cqmin;background:var(--fg);color:var(--bg)}
.lvl:active{background:var(--muted)}
.lvl .cap{color:var(--bg);opacity:.65}
.lvl b{font-weight:800;font-size:6.6cqmin;line-height:1}
.progs{display:flex;flex-direction:column;gap:2cqmin}
.prog b{font-weight:700;font-size:6.4cqmin}
.prog small{font:500 4.6cqmin/1 var(--mono);color:var(--heat-ink);white-space:nowrap}
.tgl{display:flex;gap:2cqmin}
.tgl button{flex:1;min-height:13cqmin;border-radius:8cqmin;background:var(--surface);font-size:4.8cqmin;font-weight:600;color:var(--muted)}
.tgl button[aria-pressed="true"]{background:var(--cool-soft);color:var(--cool)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1.6cqmin}
.wc{display:flex;flex-direction:column;align-items:stretch;gap:1.2cqmin}
.wb{height:12cqmin;display:flex;align-items:flex-end}
.wb i{display:block;width:100%;border-radius:1cqmin 1cqmin .4cqmin .4cqmin;background:var(--heat)}
.wb i.z{height:.7cqmin!important;background:var(--line)}
.wc span{text-align:center;font:500 4.2cqmin/1 var(--mono);color:var(--muted)}
.wc.now span{color:var(--fg)}
.warn{text-align:center;font-size:4.6cqmin;line-height:1.3;color:var(--muted);padding-top:1cqmin}

/* Sesión */
#session{display:flex;align-items:center;justify-content:center;
  background:var(--bg);background:color-mix(in srgb,var(--ph) 11%,var(--bg));transition:background .4s;--ph:var(--muted)}
.dial{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov-track{fill:none;stroke:var(--line);stroke-width:4}
.ov-arc{fill:none;stroke:var(--fg);stroke-width:4;stroke-linecap:round;stroke-dasharray:666.02;stroke-dashoffset:666.02}
.track{fill:none;stroke:var(--surface2);stroke-width:9}
.ring{fill:none;stroke:var(--ph);stroke-width:9;stroke-linecap:round;stroke-dasharray:490.09;stroke-dashoffset:0;transition:stroke .3s}
.dg0{stop-color:var(--ph);stop-opacity:.55}
.dg1{stop-color:var(--ph);stop-opacity:.1}
.disc{stroke:var(--ph);stroke-width:2.5;transition:stroke .3s}
#disc{transform-box:fill-box;transform-origin:center;transition:transform var(--dt,.5s) ease-in-out}
.read{position:absolute;inset:0;pointer-events:none}
.word{position:absolute;left:0;right:0;top:22cqmin;font:800 6.6cqmin/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--ph);transition:color .3s;text-align:center}
.num{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font:500 25cqmin/1 var(--mono);font-variant-numeric:tabular-nums;text-align:center}
.pos{position:absolute;left:0;right:0;bottom:22.5cqmin;font:500 4.6cqmin/1 var(--mono);color:var(--muted);text-align:center}

/* Pausa y fin */
#pause,#done{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqmin;text-align:center}
#pause{background:color-mix(in srgb,var(--bg) 92%,transparent)}
#done{background:var(--bg)}
#pause h2,#done h2{font:800 9cqmin/1 var(--display);letter-spacing:.01em}
.pb{width:58cqmin;min-height:15cqmin;border-radius:8cqmin;background:var(--surface2);font-weight:700;font-size:6.2cqmin}
.pb.pri{background:var(--heat);color:var(--bg)}
.donering{width:20cqmin;height:20cqmin}
.dstat{font:500 5.2cqmin/1.3 var(--mono);color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  #disc,.ring,.disc,.tr-arc,#session{transition:none}
}
</style>
</head>
<body>

<div id="watch">
  <section id="home" class="view" aria-label="Inicio">
    <div class="stack">
      <div class="today">
        <div class="tr">
          <svg viewBox="0 0 88 88" aria-hidden="true"><circle class="tr-track" cx="44" cy="44" r="36"/><circle class="tr-arc" id="tr-arc" cx="44" cy="44" r="36" transform="rotate(-90 44 44)"/></svg>
          <div class="tr-n" id="tr-n">0/3</div>
        </div>
        <span class="streak" id="streak">Racha 0 días</span>
      </div>
      <button type="button" class="btn lvl" id="lvl" aria-label="Cambiar nivel"></button>
      <div class="cap">Toca un programa</div>
      <div class="progs" id="progs"></div>
      <div class="tgl">
        <button type="button" id="t-vib" aria-pressed="true">Vibración</button>
        <button type="button" id="t-snd" aria-pressed="false">Sonido</button>
      </div>
      <div class="cap">Últimos 7 días</div>
      <div class="week" id="week"></div>
      <p class="warn">Si notas dolor, detén el ejercicio.</p>
    </div>
  </section>

  <section id="session" class="view" hidden aria-label="Sesión" role="button" tabindex="0">
    <svg class="dial" viewBox="0 0 220 220" aria-hidden="true">
      <defs><radialGradient id="dg" cx="50%" cy="45%" r="60%"><stop class="dg0" offset="0"/><stop class="dg1" offset="1"/></radialGradient></defs>
      <circle class="ov-track" cx="110" cy="110" r="106"/>
      <circle class="ov-arc" id="ov" cx="110" cy="110" r="106" transform="rotate(-90 110 110)"/>
      <circle class="track" cx="110" cy="110" r="78"/>
      <circle class="ring" id="ring" cx="110" cy="110" r="78" transform="rotate(-90 110 110)"/>
      <g id="disc"><circle class="disc" cx="110" cy="110" r="44" fill="url(#dg)"/></g>
    </svg>
    <div class="read">
      <div class="word" id="s-word">Prepárate</div>
      <div class="num" id="s-num">5</div>
      <div class="pos" id="s-pos"></div>
    </div>
  </section>

  <section id="pause" class="view" hidden aria-label="Pausa">
    <h2>En pausa</h2>
    <button type="button" class="pb pri" id="p-go">Continuar</button>
    <button type="button" class="pb" id="p-exit">Salir</button>
  </section>

  <section id="done" class="view" hidden aria-label="Sesión completada">
    <svg class="donering" viewBox="0 0 96 96" fill="none" aria-hidden="true"><circle cx="48" cy="48" r="42" stroke="var(--heat)" stroke-width="6"/><path d="M30 49l12 12 24-26" stroke="var(--heat)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>Hecho</h2>
    <div class="dstat" id="d-stat"></div>
    <button type="button" class="pb pri" id="d-ok">Listo</button>
  </section>
</div>
<p class="pv">Vista previa del reloj. En el Galaxy Watch ocupa toda la pantalla. Toca un programa para probar la sesión.</p>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};

var PROGS={
  resistencia:{name:'Resistencia'},
  rapidos:{name:'Rápidos'},
  mixto:{name:'Mixto'},
  rendimiento:{name:'Rendimiento'},
  relajacion:{name:'Relajación'}
};
var LEVELS=['Principiante','Intermedio','Avanzado'];
var CO=666.02,CI=490.09,CT=226.19;

/* ---------- Datos ---------- */
var KEY='kegel-watch-v1';
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));return r&&typeof r==='object'?r:{}}catch(e){return{}}}
var DB=Object.assign({days:{},level:0,prog:'resistencia',sound:false,vib:true,goal:3},load());
if(!DB.days||typeof DB.days!=='object')DB.days={};
if([0,1,2].indexOf(DB.level)<0)DB.level=0;
if(!PROGS[DB.prog])DB.prog='resistencia';
DB.goal=Math.min(8,Math.max(1,parseInt(DB.goal,10)||3));
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayN(){var d=DB.days[key(new Date())];return d&&d.n?d.n:0}
function streak(){
  var d=new Date();d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(!(DB.days[key(d)]&&DB.days[key(d)].n>0))d.setDate(d.getDate()-1);
  var n=0;
  while(DB.days[key(d)]&&DB.days[key(d)].n>0){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- Programas ---------- */
function setsFor(p,lv){
  var out=[],i;
  var H={t:'hold',reps:[8,10,10][lv],a:[3,5,8][lv],b:[3,4,5][lv]};
  var F={t:'flick',reps:[10,15,20][lv],a:1,b:1};
  if(p==='resistencia'){for(i=0;i<[2,3,3][lv];i++)out.push(H)}
  if(p==='rapidos'){for(i=0;i<[2,3,3][lv];i++)out.push(F)}
  if(p==='mixto'){for(i=0;i<[1,2,2][lv];i++){out.push(Object.assign({},H,{reps:[6,8,8][lv]}));out.push(Object.assign({},F,{reps:[10,12,15][lv]}))}}
  if(p==='relajacion'){out.push({t:'breath',reps:[6,8,10][lv],a:[4,5,6][lv],b:[4,5,6][lv]})}
  if(p==='rendimiento'){
    out.push(Object.assign({},H,{reps:[6,8,8][lv],a:[3,5,6][lv],b:[3,4,4][lv]}));
    out.push({t:'ladder',reps:[4,5,6][lv],a:[2,2,3][lv],b:4});
    out.push(Object.assign({},F,{reps:[10,12,15][lv]}));
    out.push({t:'breath',reps:[4,5,6][lv],a:[4,5,5][lv],b:[4,5,5][lv]});
  }
  return out;
}
function buildPlan(p,lv){
  var sets=setsFor(p,lv),steps=[{kind:'prep',t:'prep',dur:5}];
  sets.forEach(function(s,si){
    for(var r=1;r<=s.reps;r++){
      var base={t:s.t,set:si+1,sets:sets.length,rep:r,reps:s.reps};
      if(s.t==='breath'){
        steps.push(Object.assign({},base,{kind:'inhale',dur:s.a}));
        steps.push(Object.assign({},base,{kind:'exhale',dur:s.b}));
      }else if(s.t==='ladder'){
        for(var l=1;l<=3;l++)steps.push(Object.assign({},base,{kind:'on',dur:s.a,lvl:l,sc:[.85,.7,.55][l-1]}));
        steps.push(Object.assign({},base,{kind:'off',dur:s.b}));
      }else{
        steps.push(Object.assign({},base,{kind:'on',dur:s.a}));
        steps.push(Object.assign({},base,{kind:'off',dur:s.b}));
      }
    }
    if(si<sets.length-1)steps.push({kind:'rest',t:'rest',set:si+1,sets:sets.length,dur:s.t==='flick'?15:20});
  });
  return steps;
}
function planSec(p,lv){return buildPlan(p,lv).reduce(function(a,s){return a+s.dur},0)}
function mins(sec){return Math.max(1,Math.round(sec/60))}
function label(st){
  switch(st.kind){
    case 'prep':return 'Prepárate';
    case 'on':return st.t==='ladder'?'Nivel '+st.lvl:(st.t==='flick'?'Aprieta':'Contrae');
    case 'off':return 'Suelta';
    case 'inhale':return 'Inspira';
    case 'exhale':return 'Espira';
    default:return 'Descansa';
  }
}
var COLOR={on:'var(--heat)',off:'var(--cool)',inhale:'var(--cool)',exhale:'var(--cool)',rest:'var(--muted)',prep:'var(--muted)'};
var SCALE={on:.58,off:1,inhale:1.06,exhale:.92,rest:1,prep:1};

/* ---------- Inicio ---------- */
function renderHome(){
  $('#lvl').innerHTML='<span class="cap">Nivel</span><b>'+LEVELS[DB.level]+'</b>';
  $('#progs').innerHTML=Object.keys(PROGS).map(function(id){
    return '<button type="button" class="btn prog" data-p="'+id+'"><b>'+PROGS[id].name+'</b><small>≈ '+mins(planSec(id,DB.level))+' min</small></button>';
  }).join('');
  $('#t-vib').setAttribute('aria-pressed',String(!!DB.vib));
  $('#t-snd').setAttribute('aria-pressed',String(!!DB.sound));
  var n=todayN(),g=DB.goal,st=streak();
  $('#tr-arc').style.strokeDashoffset=(CT*(1-Math.min(1,n/g))).toFixed(2);
  $('#tr-n').textContent=n+'/'+g;
  $('#streak').textContent='Racha '+st+(st===1?' día':' días');
  var now=new Date(),days=[],i,max=g;
  for(i=6;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),rec=DB.days[key(d)],c=rec&&rec.n?rec.n:0;
    days.push({d:d,n:c});if(c>max)max=c;
  }
  $('#week').innerHTML=days.map(function(x,k){
    var h=x.n?Math.max(10,x.n/max*100):0;
    return '<div class="wc'+(k===6?' now':'')+'"><div class="wb"><i class="'+(x.n?'':'z')+'" style="height:'+h+'%"></i></div><span>'+'DLMXJVS'.charAt(x.d.getDay())+'</span></div>';
  }).join('');
}

/* ---------- Hardware: vibración, sonido, pantalla ---------- */
var HW=window.AndroidWatch,AC=null,WL=null;
function buzz(p){
  if(!DB.vib)return;
  try{
    if(HW&&HW.vibrate)HW.vibrate(p.join(','));
    else if(navigator.vibrate)navigator.vibrate(p);
  }catch(e){}
}
function awake(on){
  try{
    if(HW&&HW.keepAwake)HW.keepAwake(!!on);
    else if(on&&navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){WL=l}).catch(function(){});
    else if(!on&&WL){WL.release();WL=null}
  }catch(e){}
}
function beep(f,d){
  if(!DB.sound||!AC)return;
  try{
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.start(t);o.stop(t+d+0.03);
  }catch(e){}
}
function cue(st){
  if(st.kind==='on'){
    if(st.t==='ladder'){var a=[],i;for(i=0;i<st.lvl;i++){if(i)a.push(60);a.push(90)}buzz(a)}
    else buzz(st.t==='flick'?[70]:[160]);
    beep(660,.14);
  }else if(st.kind==='off'){
    if(st.t!=='flick')buzz([40]);
    beep(440,.12);
  }else if(st.kind==='exhale'){buzz([45]);beep(440,.12)}
  else if(st.kind==='inhale'){buzz([45]);beep(520,.12)}
  else if(st.kind==='rest'){buzz([70,60,70]);beep(330,.25)}
}

/* ---------- Sesión ---------- */
var S=null;
function startSession(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume()}catch(e){AC=null}
  var steps=buildPlan(DB.prog,DB.level),starts=[],acc=0;
  steps.forEach(function(s){starts.push(acc);acc+=s.dur});
  S={steps:steps,starts:starts,total:acc,i:0,el:0,paused:false,last:performance.now(),hold:0,timer:null,done:false};
  $('#done').hidden=true;$('#pause').hidden=true;$('#session').hidden=false;
  awake(true);enterStep(true);render();
  S.timer=setInterval(tick,100);
}
function enterStep(first){
  var st=S.steps[S.i];
  $('#s-word').textContent=label(st);
  $('#session').style.setProperty('--ph',COLOR[st.kind]);
  var dt=st.kind==='on'?.45:st.kind==='off'?.9:(st.kind==='inhale'||st.kind==='exhale')?st.dur:.6;
  var disc=$('#disc');
  disc.style.setProperty('--dt',Math.min(dt,st.dur)+'s');
  disc.style.transform='scale('+(st.sc||SCALE[st.kind])+')';
  var pos;
  if(st.kind==='prep')pos='Respira y relaja';
  else if(st.kind==='rest')pos='Entre series';
  else pos='Serie '+st.set+'/'+st.sets+' · '+st.rep+'/'+st.reps;
  $('#s-pos').textContent=pos;
  if(!first)cue(st);
}
function render(){
  var st=S.steps[S.i],left=Math.max(0,st.dur-S.el),pos=S.starts[S.i]+S.el;
  $('#s-num').textContent=Math.max(0,Math.ceil(left-0.001));
  $('#ring').style.strokeDashoffset=(CI*Math.min(1,S.el/st.dur)).toFixed(2);
  $('#ov').style.strokeDashoffset=(CO*(1-Math.min(1,pos/S.total))).toFixed(2);
}
function tick(){
  if(!S||S.paused||S.done){if(S)S.last=performance.now();return}
  var now=performance.now(),dt=Math.min(0.5,(now-S.last)/1000);
  S.last=now;S.el+=dt;
  var st=S.steps[S.i];
  if(S.el>=st.dur){
    S.el-=st.dur;
    if(st.kind==='on')S.hold+=st.dur;
    S.i++;
    if(S.i>=S.steps.length){finish();return}
    enterStep(false);
  }
  render();
}
function setPaused(p){
  if(!S||S.done)return;
  S.paused=p;S.last=performance.now();
  $('#pause').hidden=!p;
  awake(!p);
}
function closeSession(){
  if(S&&S.timer)clearInterval(S.timer);
  awake(false);S=null;
  $('#session').hidden=true;$('#pause').hidden=true;$('#done').hidden=true;
  renderHome();
}
function finish(){
  clearInterval(S.timer);S.done=true;awake(false);
  buzz([200,90,200,90,350]);beep(523,.22);setTimeout(function(){beep(784,.4)},220);
  var k=key(new Date()),d=DB.days[k]||(DB.days[k]={n:0,sec:0,hold:0});
  d.n=(d.n||0)+1;d.sec=(d.sec||0)+Math.round(S.total);d.hold=(d.hold||0)+Math.round(S.hold);
  save();
  $('#d-stat').textContent=Math.floor(S.total/60)+':'+pad(Math.round(S.total%60))+' · hoy '+todayN()+'/'+DB.goal;
  $('#session').hidden=true;$('#pause').hidden=true;$('#done').hidden=false;
  renderHome();
}

/* ---------- Eventos ---------- */
$('#progs').addEventListener('click',function(e){
  var b=e.target.closest('.prog');if(!b)return;
  DB.prog=b.dataset.p;save();startSession();
});
$('#lvl').addEventListener('click',function(){DB.level=(DB.level+1)%3;save();renderHome()});
$('#t-vib').addEventListener('click',function(){DB.vib=!DB.vib;save();renderHome();if(DB.vib)buzz([40])});
$('#t-snd').addEventListener('click',function(){
  DB.sound=!DB.sound;save();renderHome();
  if(DB.sound){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();beep(520,.12)}catch(e){}}
});
$('#session').addEventListener('click',function(){setPaused(true)});
$('#session').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();setPaused(true)}});
$('#p-go').addEventListener('click',function(){setPaused(false)});
$('#p-exit').addEventListener('click',closeSession);
$('#d-ok').addEventListener('click',closeSession);
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S&&!S.done&&!S.paused)setPaused(true);
});

renderHome();
})();
</script>
